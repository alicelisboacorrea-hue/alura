<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blog</title>
  <style>
    header {
      background-color: #66CDAA;
      color: #000000;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      border: 5px solid #1E90FF;
    }   
    
    main {
      background-color: #66CDAA;
      color: #000000;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 17px;
    }

    article {
      display: flex;
    }

    img {
      width: 150px;
      height: 150px;
    }

    .artigo-autor {
      font-weight: bold;
    }
  </style>
</head>
<body>  
  <header> 
    <h1>CINEMA DE AGORA 🎬​🍿</h1>
    <h2>Minha pagina sobre cinema​🎬</h2>
    <p>Aqui vou compartilhar curiosidades do cinema atual sobre filmes, séries, animações, etc.🎬​🎥​</p>
  </header>

  <main>  
    <article>
      <img src="cinema.png" alt="Ilustração sobre cinema"> 
      <div>
        <h2>MEU PRIMEIRO POST</h2>
        <p class="artigo-autor">POR: ALICE GABRIELLE</p>
        <p>Boas Vindas ao meu novo blog! Aqui vou compartilhar informações sobre o mundo do cinema!</p>
        <button>❤️ <span>0</span></button>
        <button>👍 <span>0</span></button>
      </div>
    </article>
  </main>

  <script>
    const botoes = document.querySelectorAll("button");
    
    botoes.forEach(function(botao) {
      botao.addEventListener("click", function() {
        const contador = botao.querySelector("span");
        let numeroAtual = parseInt(contador.textContent);
        contador.textContent = numeroAtual + 1;
      });
    });
  </script>
</body>    
</html>
